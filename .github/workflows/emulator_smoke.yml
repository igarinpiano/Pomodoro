name: Emulator Smoke Test

# リリース APK を Android エミュレータに入れて実際に操作する確認。時間がかかる（約15分）ので手動実行のみ。
on:
  workflow_dispatch:

jobs:
  smoke:
    name: Release APK on emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 通知・アラーム・サービスの制限が変わった節目のバージョン。
        # Android 7.x（API 24/25）のイメージは現在のエミュレータで起動が完了しないため、
        # 最小対応バージョンの確認は単体テスト（Robolectric の SDK 24）で行う
        api-level: [26, 28, 31, 34]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Google Play 開発者サービス入りのイメージは起動直後の負荷が高く、操作が空振りしやすいので AOSP 版を使う
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/smoke.sh

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-api${{ matrix.api-level }}
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 14
