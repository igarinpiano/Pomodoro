name: Emulator Smoke Test

# リリース APK を Android エミュレータに入れて実際に操作する確認。時間がかかる（約15分）ので手動実行のみ。
on:
  workflow_dispatch:

jobs:
  smoke:
    name: Release APK on emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 最小対応の Android 7.0 から、通知・アラーム・サービスの制限が変わった節目のバージョンまで。
        # Android 7.0 の 64bit イメージは現在のエミュレータで起動しないため、32bit イメージを使う
        include:
          - { api-level: 24, arch: x86, profile: '', cores: 2, ram-size: '' }
          - { api-level: 26, arch: x86_64, profile: pixel_6, cores: 3, ram-size: 4096M }
          - { api-level: 28, arch: x86_64, profile: pixel_6, cores: 3, ram-size: 4096M }
          - { api-level: 31, arch: x86_64, profile: pixel_6, cores: 3, ram-size: 4096M }
          - { api-level: 34, arch: x86_64, profile: pixel_6, cores: 3, ram-size: 4096M }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # KSP（Room のコード生成）は終了時にまれに無害な例外を出力することがある（ビルド結果には影響しない）。
      # setup-java の検出ルールがそれをエラーの注釈として表示してしまうので、ルールを外しておく
      - name: Disable Java problem matcher
        run: echo "::remove-matcher owner=java::"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Google Play 開発者サービス入りのイメージは起動直後の負荷が高く、操作が空振りしやすいので AOSP 版を使う
          target: default
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram-size }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          # 先に端末上のテスト（ファイルの書き出し／読み込みなど）を実行し、続けてリリース APK を操作する
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            bash .github/scripts/smoke.sh

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-api${{ matrix.api-level }}
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 14
